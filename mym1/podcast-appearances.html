<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podcasts & Media Appearances | Cassidy Torrey | Manifest Media</title>
  <meta name="description" content="Listen to Cassidy Torrey on Shared Practices Ep 6-32, Syreta Talks Mindset Warriors, Independent Artist Radio, and eZWay Golden Gala 2026. (603) 630-3944.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/theme-cinematic.css">
  <link rel="stylesheet" href="./css/theme-clinical.css">
  <link rel="stylesheet" href="./css/ab-switcher.css">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-[#f8fafc] text-slate-900 selection:bg-blue-600 selection:text-white">

  <div id="root"></div>

  <!-- Data & Utils -->
  <script src="./js/data/caseStudies.js"></script>
  <script src="./js/data/fivePs.js"></script>
  <script src="./js/data/podcastData.js"></script>
  <script src="./js/data/competitorComparison.js"></script>
  <script src="./js/data/faqItems.js"></script>
  <script src="./js/data/synergiesData.js"></script>
  <script src="./js/data/calculatorPresets.js"></script>
  <script src="./js/data/testimonials.js"></script>
  <script src="./js/data/pressClips.js"></script>
  <script src="./js/utils/formatters.js"></script>
  <script src="./js/utils/analytics.js"></script>
  <script src="./js/utils/abTesting.js"></script>
  <script src="./js/utils/schemaGenerator.js"></script>

  <!-- Components -->
  <script src="./js/components/MoneyManifestationBanner.js"></script>
  <script src="./js/components/Navbar.js"></script>
  <script src="./js/components/TrustBadgesBar.js"></script>
  <script src="./js/components/MediaAppearances.js"></script>
  <script src="./js/components/DisambiguationBanner.js"></script>
  <script src="./js/components/LeadCaptureForm.js"></script>
  <script src="./js/components/Footer.js"></script>
  <script src="./js/components/ABSwitcherFooter.js"></script>
  <script src="./js/components/BookingModal.js"></script>
  <script src="./js/components/VideoPlayerModal.js"></script>
  <script src="./js/app.js"></script>

  <script>
    (function() {
      var e = React.createElement;

      function PodcastsPage() {
        React.useEffect(function() {
          window.initManifestApp({ depth: 0, variant: 'podcasts' });
        }, []);

        var podcasts = window.PODCAST_DATA || [];

        return e('div', { className: 'min-h-screen flex flex-col justify-between' },
          e('div', null,
            e(window.MoneyManifestationBanner, { basePath: './' }),
            e(window.Navbar, { basePath: './', currentPath: 'podcast-appearances.html' }),

            // Hero Header
            e('section', { className: 'py-20 bg-white border-b border-slate-200 text-center relative' },
              e('div', { className: 'container-custom max-w-4xl mx-auto space-y-4' },
                e('div', { className: 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-800 border border-blue-200' }, 'Broadcasting & Keynotes'),
                e('h1', { className: 'text-3xl md:text-5xl font-newsreader font-bold text-slate-900 tracking-tight' },
                  'Cassidy Torrey: ',
                  e('span', { className: 'text-blue-600' }, 'Podcasts & Media Appearances')
                ),
                e('p', { className: 'text-slate-600 text-base md:text-lg max-w-2xl mx-auto leading-relaxed' },
                  'Explore Cassidy Torrey’s key broadcasts spanning dental marketing innovation, executive resilience, independent filmmaking, and Hollywood red-carpet galas.'
                )
              )
            ),

            e(window.TrustBadgesBar, { basePath: './' }),
            e(window.MediaAppearances, { basePath: './' }),

            // Detailed Episode Summaries
            e('section', { className: 'py-16 bg-slate-50 border-y border-slate-200' },
              e('div', { className: 'container-custom max-w-4xl mx-auto space-y-8' },
                podcasts.map(function(item, idx) {
                  return e('div', { key: idx, className: 'bg-white rounded-xl border border-slate-200 p-6 md:p-8 space-y-4 shadow-sm' },
                    e('div', { className: 'flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3' },
                      e('div', null,
                        e('span', { className: 'text-xs uppercase font-bold text-blue-800 font-mono tracking-wider' }, item.format),
                        e('h2', { className: 'text-lg md:text-xl font-bold text-slate-900 font-newsreader mt-0.5' }, item.title)
                      ),
                      e('span', { className: 'text-xs text-slate-500 font-mono' }, item.date)
                    ),
                    e('div', { className: 'text-xs font-semibold text-blue-700' }, item.subtitle),
                    e('p', { className: 'text-sm text-slate-700 leading-relaxed' }, item.description),
                    e('div', { className: 'flex flex-wrap items-center justify-between pt-2 border-t border-slate-100' },
                      e('div', { className: 'flex flex-wrap gap-2 text-xs text-slate-600' },
                        item.topics.map(function(t, i) {
                          return e('span', { key: i, className: 'px-2.5 py-1 rounded-md bg-slate-50 border border-slate-200 text-[11px] font-medium text-slate-700' }, '🏷️ ' + t);
                        })
                      ),
                      e('button', {
                        onClick: function() {
                          if (window.openVideoModal) window.openVideoModal(item.title, item.subtitle);
                        },
                        className: 'text-xs font-bold text-blue-600 hover:text-blue-800 mt-2 sm:mt-0'
                      }, 'Listen / Watch Clip →')
                    )
                  );
                })
              )
            ),

            e(window.DisambiguationBanner, { basePath: './' }),

            // Booking Form
            e('section', { className: 'py-20 bg-white border-t border-slate-200 text-center' },
              e('div', { className: 'container-custom max-w-4xl mx-auto space-y-6' },
                e('div', { className: 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-800 border border-blue-200' }, 'Keynote & Speaking Inquiries'),
                e('h2', { className: 'text-3xl text-slate-900 font-newsreader font-bold' }, 'Invite Cassidy Torrey to Speak or Consult'),
                e(window.LeadCaptureForm, { basePath: './' })
              )
            )
          ),

          e('div', null,
            e(window.Footer, { basePath: './' }),
            e(window.ABSwitcherFooter, { depth: 0, activeId: 'master' }),
            e(window.BookingModal, { basePath: './' }),
            e(window.VideoPlayerModal, { basePath: './' })
          )
        );
      }

      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(PodcastsPage));
    })();
  </script>
</body>
</html>
