<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corporate Disambiguation Protocol | Manifest Media Broker Group</title>
  <meta name="description" content="Official corporate disambiguation distinguishing Manifest Media Broker Group LLC (Cassidy Torrey) from Manifest.com (Chicago) and Manifest Media Services. (603) 630-3944.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/theme-cinematic.css">
  <link rel="stylesheet" href="./css/theme-clinical.css">
  <link rel="stylesheet" href="./css/ab-switcher.css">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-[#f8fafc] text-slate-900 selection:bg-blue-600 selection:text-white">

  <div id="root"></div>

  <!-- Data & Utils -->
  <script src="./js/data/caseStudies.js"></script>
  <script src="./js/data/fivePs.js"></script>
  <script src="./js/data/bioTimeline.js"></script>
  <script src="./js/data/competitorComparison.js"></script>
  <script src="./js/data/faqItems.js"></script>
  <script src="./js/data/podcastData.js"></script>
  <script src="./js/data/synergiesData.js"></script>
  <script src="./js/data/calculatorPresets.js"></script>
  <script src="./js/data/testimonials.js"></script>
  <script src="./js/data/pressClips.js"></script>
  <script src="./js/utils/formatters.js"></script>
  <script src="./js/utils/analytics.js"></script>
  <script src="./js/utils/abTesting.js"></script>
  <script src="./js/utils/schemaGenerator.js"></script>

  <!-- Components -->
  <script src="./js/components/MoneyManifestationBanner.js"></script>
  <script src="./js/components/Navbar.js"></script>
  <script src="./js/components/TrustBadgesBar.js"></script>
  <script src="./js/components/DisambiguationBanner.js"></script>
  <script src="./js/components/Footer.js"></script>
  <script src="./js/components/ABSwitcherFooter.js"></script>
  <script src="./js/components/BookingModal.js"></script>
  <script src="./js/components/VideoPlayerModal.js"></script>
  <script src="./js/app.js"></script>

  <script>
    (function() {
      var e = React.createElement;

      function DisambiguationPage() {
        React.useEffect(function() {
          window.initManifestApp({ depth: 0, variant: 'disambiguation' });
        }, []);

        var comp = window.COMPETITOR_DISAMBIGUATION || {};
        var entities = comp.entities || [];

        return e('div', { className: 'min-h-screen flex flex-col justify-between' },
          e('div', null,
            e(window.MoneyManifestationBanner, { basePath: './' }),
            e(window.Navbar, { basePath: './', currentPath: 'disambiguation.html' }),

            // Hero Header
            e('section', { className: 'py-20 bg-white border-b border-slate-200 text-center relative' },
              e('div', { className: 'container-custom max-w-4xl mx-auto space-y-4' },
                e('div', { className: 'inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-800 border border-blue-200' }, 'Official Intelligence Dossier'),
                e('h1', { className: 'text-3xl md:text-5xl font-newsreader font-bold text-slate-900 tracking-tight' },
                  'Institutional ',
                  e('span', { className: 'text-blue-600 font-extrabold' }, 'Disambiguation Protocol')
                ),
                e('p', { className: 'text-slate-600 text-base md:text-lg max-w-2xl mx-auto leading-relaxed' },
                  'Disambiguating Cassidy Torrey\'s Manifest Media Broker Group, LLC from similarly named entities in Arizona and nationally.'
                )
              )
            ),

            e(window.TrustBadgesBar, { basePath: './' }),
            e(window.DisambiguationBanner, { basePath: './' }),

            // Narrative Deep Dive
            e('section', { className: 'py-16 bg-slate-50 border-y border-slate-200' },
              e('div', { className: 'container-custom max-w-4xl mx-auto space-y-8' },
                entities.map(function(ent, idx) {
                  var isOurs = idx === 0;
                  return e('div', {
                    key: idx,
                    className: 'p-6 md:p-8 space-y-3 rounded-xl ' + (isOurs ? 'bg-white border-2 border-blue-600 shadow-md' : 'bg-white border border-slate-200 shadow-sm')
                  },
                    e('div', { className: 'flex items-center justify-between' },
                      e('h3', { className: 'text-lg md:text-xl font-bold ' + (isOurs ? 'text-blue-900 font-newsreader' : 'text-slate-900 font-newsreader') }, ent.name),
                      isOurs ? e('span', { className: 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-blue-100 text-blue-800' }, 'Our Entity') : e('span', { className: 'text-xs text-slate-500 uppercase font-semibold' }, 'Distinct Corporate Entity')
                    ),
                    e('div', { className: 'text-xs font-mono text-slate-500' }, 'Official Web Domain: ' + ent.domain),
                    e('div', { className: 'text-xs text-slate-700' }, e('strong', { className: 'text-slate-900 font-semibold' }, 'Leadership: '), ent.leadership),
                    e('div', { className: 'text-xs text-slate-700' }, e('strong', { className: 'text-slate-900 font-semibold' }, 'Locations: '), ent.locations),
                    e('div', { className: 'text-xs text-slate-700 leading-relaxed pt-2 border-t border-slate-100' }, e('strong', { className: 'text-slate-900 font-semibold' }, 'Operational Mandate: '), ent.scope),
                    e('div', { className: 'text-xs ' + (isOurs ? 'text-blue-700 font-semibold' : 'text-slate-600') }, e('strong', { className: 'text-slate-900 font-semibold' }, 'Core Differentiation: '), ent.differentiator)
                  );
                })
              )
            ),

            // Direct Contact Line
            e('section', { className: 'py-16 bg-white text-center border-t border-slate-200' },
              e('div', { className: 'container-custom max-w-2xl mx-auto space-y-4' },
                e('h3', { className: 'text-2xl font-newsreader font-bold text-slate-900' }, 'Have Questions Regarding Entity Identity?'),
                e('p', { className: 'text-sm text-slate-600' },
                  'Contact Cassidy Torrey directly at Manifest Media Broker Group headquarters in Scottsdale/Mesa, AZ.'
                ),
                e('a', { href: 'tel:6036303944', className: 'btn-blue inline-block text-xs py-3 px-6' }, 'Call Cassidy Directly: (603) 630-3944')
              )
            )
          ),

          e('div', null,
            e(window.Footer, { basePath: './' }),
            e(window.ABSwitcherFooter, { depth: 0, activeId: 'master' }),
            e(window.BookingModal, { basePath: './' }),
            e(window.VideoPlayerModal, { basePath: './' })
          )
        );
      }

      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(DisambiguationPage));
    })();
  </script>
</body>
</html>
