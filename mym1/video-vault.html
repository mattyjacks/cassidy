  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Reel Video Vault | Manifest Media Broker Group</title>
  <meta name="description" content="Watch 4K patient documentary case films, executive interviews, and production showcases directed by Cassidy Torrey. (603) 630-3944.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body class="bg-[#07090e] text-slate-100">

  <div id="root"></div>

  <!-- Data & Utils -->

  <script src="./js/app.js"></script>

  <script>
    (function() {
      var e = React.createElement;

      function VideoVaultPage() {
        React.useEffect(function() {
          window.initManifestApp({ depth: 0, variant: 'video-vault' });
        }, []);

        return e('div', { className: 'min-h-screen flex flex-col justify-between' },
          e('div', null,
            e(window.MoneyManifestationBanner, { basePath: './' }),
            e(window.Navbar, { basePath: './', currentPath: 'video-vault.html' }),

            e('section', { className: 'py-16 bg-gradient-to-b from-[#140f24] via-[#0b0813] to-[#07090e] border-b border-yellow-500/20 text-center relative' },
              e('div', { className: 'container-custom max-w-4xl mx-auto space-y-4' },
                e('div', { className: 'badge-pill' }, 'High-Bitrate Clinical Media'),
                e('h1', { className: 'text-white' },
                  'The Cinema Reel ',
                  e('span', { className: 'gold-gradient-text' }, 'Video Vault')
                ),
                e('p', { className: 'text-slate-300 text-base md:text-lg max-w-2xl mx-auto leading-relaxed' },
                  'Explore 4K anamorphic patient documentary reels, clinical breakthroughs, and the New Hollywood entertainment slate.'
                )
              )
            ),

            e(window.TrustBadgesBar, { basePath: './' }),
            e(window.VideoVaultGrid, { basePath: './' }),
            e(window.IronCladGuaranteeBadge, { basePath: './' }),
            e(window.DisambiguationBanner, { basePath: './' })
          ),

          e('div', null,
            e(window.Footer, { basePath: './' }),
            e(window.ABSwitcherFooter, { depth: 0, activeId: 'master' }),
            e(window.BookingModal, { basePath: './' }),
            e(window.VideoPlayerModal, { basePath: './' })
          )
        );
      }

      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(VideoVaultPage));
    })();
  </script>
</body>
</html>
