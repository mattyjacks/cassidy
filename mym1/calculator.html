  <script src="./js/app.js"></script>

  <script>
    (function() {
      var e = React.createElement;

      function CalculatorPage() {
        React.useEffect(function() {
          window.initManifestApp({ depth: 0, variant: 'calculator' });
        }, []);

        return e('div', { className: 'min-h-screen flex flex-col justify-between' },
          e('div', null,
            e(window.MoneyManifestationBanner, { basePath: './' }),
            e(window.Navbar, { basePath: './', currentPath: 'calculator.html' }),

            // Hero Header
            e('section', { className: 'py-20 bg-gradient-to-b from-[#111c2e] via-[#09101d] to-[#07090e] border-b border-yellow-500/20 text-center relative' },
              e('div', { className: 'container-custom max-w-4xl mx-auto space-y-4' },
                e('div', { className: 'badge-pill' }, 'Empirical Financial Forecasting'),
                e('h1', { className: 'text-white' },
                  'Practice Revenue & ',
                  e('span', { className: 'gold-gradient-text' }, 'Chair Capacity Simulator')
                ),
                e('p', { className: 'text-slate-300 text-base md:text-lg max-w-2xl mx-auto leading-relaxed' },

              )
            ),

            e(window.TrustBadgesBar, { basePath: './' }),
            e(window.RoiCalculator, { basePath: './' }),

            // Chair Capacity Deep Dive
            e('section', { className: 'py-16 bg-[#080b12]' },

                ),

                e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                  e('div', { className: 'glass-card p-6 space-y-3 gold-border-glow' },
                    e('div', { className: 'text-xs font-bold text-amber-300 uppercase' }, 'Solo Restorative (3-4 Chairs)'),
                    e('div', { className: 'text-2xl font-mono font-bold text-white' }, '+$32,000 / mo'),
                    e('p', { className: 'text-xs text-slate-400 leading-relaxed' }, 'Eliminates 8 unbooked chair slots per week. Requires only 1 single arch case or 3 single implants per month to break even.')

                  e('div', { className: 'glass-card p-6 space-y-3 border-yellow-500/40 gold-border-glow' },
                    e('div', { className: 'text-xs font-bold text-yellow-300 uppercase' }, 'Multi-Doctor Center (5-8 Chairs)'),
                    e('div', { className: 'text-2xl font-mono font-bold text-emerald-400' }, '+$68,000 / mo'),
                    e('p', { className: 'text-xs text-slate-400 leading-relaxed' }, 'Fills 16 open slots per week. Typically triggers hiring of 1-2 new hygienists and front-desk coordinators to manage pipeline.')
                  ),
                  e('div', { className: 'glass-card p-6 space-y-3 gold-border-glow' },
                    e('div', { className: 'text-xs font-bold text-sky-300 uppercase' }, 'Surgical / Full-Arch Specialty (8+ Chairs)'),
                    e('div', { className: 'text-2xl font-mono font-bold text-sky-400' }, '+$145,000 / mo'),

                )
              )
            ),

            e(window.IronCladGuaranteeBadge, { basePath: './' }),
            e(window.DisambiguationBanner, { basePath: './' }),

              e('div', { className: 'container-custom max-w-4xl mx-auto space-y-6' },

                e('h2', { className: 'text-3xl text-white font-cinzel' }, 'Request a Customized ROI Audit'),
                e(window.LeadCaptureForm, { basePath: './' })
              )
            )
          ),

          e('div', null,
            e(window.Footer, { basePath: './' }),
            e(window.ABSwitcherFooter, { depth: 0, activeId: 'master' }),
            e(window.BookingModal, { basePath: './' }),
            e(window.VideoPlayerModal, { basePath: './' })
          )
        );
      }

      var root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(e(CalculatorPage));
    })();
  </script>
</body>
</html>
